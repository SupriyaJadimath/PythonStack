<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .login-box {
        background: white;
        padding: 40px;
        width: 350px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    form {
        display: flex;
        flex-direction: column;
    }

    label {
        font-size: 15px;
        font-weight: 600;
        color: #333;
        margin-bottom: 8px;
    }

    input {
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        outline: none;
        font-size: 14px;
        margin-bottom: 18px;
        transition: 0.3s;
    }

    input:focus {
        border-color: #667eea;
        box-shadow: 0 0 5px rgba(102, 126, 234, 0.5);
    }

    button {
        padding: 12px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    p {
        color: red;
        text-align: center;
        margin-bottom: 15px;
    }
</style>

</head>
<body>
    <div class="login-box">
        {% if error %}
             <p>{{error}}</p>
        {% endif %}

    <form method="POST">
          {% csrf_token %}<br><br>
          <label for="">Username</label>
          <input type="text" placeholder="enter username" name="username" required>
<br>
          <label for="">Password</label>
          <input type="text" placeholder="enter password" name="password" required>
<br><br>
          <button type="submit">Login</button>

          <p>don't have an account?
          <a href="{% url 'registration'%}">Register here</a>
          </p>
    </form>


    </div>
    
</body>
</html>
