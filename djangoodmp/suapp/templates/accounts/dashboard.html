<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .dashboard-box {
        background: white;
        width: 400px;
        padding: 50px 35px;
        text-align: center;
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    h2 {
        color: #333;
        margin-bottom: 15px;
        font-size: 26px;
    }

    h2:nth-child(2) {
        color: #764ba2;
        font-size: 30px;
        margin-bottom: 30px;
    }

    button {
        padding: 12px 35px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        transform: translateY(-3px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
</style>

</head>
<body>
    <div class="dashboard-box">
        <h2>welcome</h2>
        <h2>{{user.username}}</h2>
        <form method="POST" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">Logout</button>

        </form>


    </div>
</body>
</html>
